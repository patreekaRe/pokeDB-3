<!doctype html><meta charset="utf-8"><title>House check</title><body><script type="module">
/* tools/house-check.mjs's page: each house built as on the lot (fine() and texOf() as js/hub-3d.js's, its merge left
   out so every piece can be hit), its draws counted as mergeStill() would merge them, and three views cast in text. */
const q = new URLSearchParams(location.search);
const ids = q.get('ids').split(','), paintN = +(q.get('paint') || 0);
const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js');
function fine(w, h, k = 4) {
  const c = new OffscreenCanvas(w * k, h * k), g = c.getContext('2d');
  c.fine = k; g.scale(k, k); g.lineJoin = g.lineCap = 'round';
  const fill = (col, path) => { g.fillStyle = col; g.beginPath(); path(); g.fill(); };
  const rr = (x, y, ww, hh, r, col) => fill(col, () => g.roundRect(x, y, ww, hh, r));
  const lin = (x0, y0, x1, y1, stops) => { const l = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => l.addColorStop(i / (stops.length - 1), s)); return l; };
  return { c, g, fill, rr, lin, shine: () => g };
}
const texOf = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const hub = { fine, texOf };
function drawsOf(root) {
  const keys = new Set(); let n = 0;
  root.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    if (o.isInstancedMesh) { n++; return; }
    const m = o.material;
    if (m.isMeshBasicMaterial && !o.parent?.visible) return;
    const bake = m.isMeshStandardMaterial && !m.map && !m.emissiveMap && !m.transparent && !m.alphaTest && !m.emissive.getHex();
    keys.add(bake ? ['bake', Math.round(m.roughness * 4) / 4, m.metalness, m.side, o.castShadow].join('|') : m.uuid + o.castShadow);
  });
  return n + keys.size;
}
const { makeHouse } = await import('/js/hub-houses.js');
const { HOUSES_BY_ID } = await import('/js/data/houses.js');
const out = [];
for (const id of ids) {
  const def = HOUSES_BY_ID[id], p = def.paints[paintN] || def.paints[0];
  // draws: merged as on the lot
  const mg = makeHouse(THREE, { id, p, x: 0, z: 0, fine: hub.fine, texOf: hub.texOf, merge: () => {} });
  let tris = 0;
  mg.group.traverse(o => { if (o.isMesh && o.visible && !(o.material.isMeshBasicMaterial && !o.material.map)) { const g = o.geometry; tris += ((g.index ? g.index.count : g.attributes.position.count) / 3) * (o.count || 1); } });
  const draws = drawsOf(mg.group) - 1;
  // elevations: unmerged, every mesh hit-tested
  const h = makeHouse(THREE, { id, p, x: 0, z: 0, fine: hub.fine, texOf: hub.texOf, merge: () => {} });
  const keys = {};
  for (const [k, v] of Object.entries(p)) if (typeof v === 'string' && v.startsWith('#')) keys[v.toLowerCase()] = k;
  const meshes = [];
  h.group.traverse(o => { if (o.isMesh && o.visible) { delete o.raycast; if (o.material.visible !== false) meshes.push(o); } });
  meshes.splice(meshes.indexOf(h.door), 1);
  h.group.updateMatrixWorld(true);
  const box = new THREE.Box3(); for (const m of meshes) box.expandByObject(m);
  const legend = new Map(), chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  const letter = (m) => {
    const mat = Array.isArray(m.material) ? m.material[0] : m.material;
    if (legend.has(mat)) return legend.get(mat).ch;
    const hex = '#' + mat.color.getHexString();
    let ch;
    if (mat.emissive && mat.emissive.getHex() && mat.emissiveMap) ch = '#';
    else if (mat.emissive && mat.emissive.getHex()) ch = '*';
    else if (keys[hex]) ch = keys[hex][0].toUpperCase();
    else if (mat.map && !mat.color.getHex()) ch = '?';
    else ch = chars[legend.size % chars.length];
    legend.set(mat, { ch, hex, key: keys[hex] || '', map: !!mat.map });
    return ch;
  };
  const ray = new THREE.Raycaster(), view = (dir, cols, rows, at) => {
    const lines = [];
    for (let r = 0; r < rows.n; r++) {
      let s = '';
      for (let c = 0; c < cols.n; c++) {
        const [o, d] = at(cols.a + c * cols.s, rows.a - r * rows.s);
        ray.set(o, d);
        const hit = ray.intersectObjects(meshes, false)[0];
        s += hit ? letter(hit.object) : ' ';
      }
      lines.push(s.replace(/\s+$/, ''));
    }
    return lines.join('\n');
  };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const top = Math.ceil(box.max.y * 10) / 10;
  const front = view(null, { a: -2.6, s: 0.08, n: 66 }, { a: top, s: 0.14, n: Math.ceil(top / 0.14) + 1 }, (x, y) => [V(x, y, 10), V(0, 0, -1)]);
  const side = view(null, { a: 1.2, s: -0.08, n: 52 }, { a: top, s: 0.14, n: Math.ceil(top / 0.14) + 1 }, (z, y) => [V(10, y, z), V(-1, 0, 0)]);
  const plan = view(null, { a: -2.6, s: 0.08, n: 66 }, { a: -3.4, s: -0.16, n: 30 }, (x, z) => [V(x, 20, z), V(0, -1, 0)]);
  out.push({ id, paint: p.name, draws, tris: Math.round(tris), box: [box.min, box.max].map(v => [v.x, v.y, v.z].map(n => +n.toFixed(2))), door: [h.door.position.x, h.door.position.y, h.door.position.z].map(n => +n.toFixed(2)),
    legend: [...legend.values()].map(l => `${l.ch}=${l.hex}${l.key ? '(' + l.key + ')' : ''}${l.map ? '+map' : ''}`).join(' '), front, side, plan });
}
window.result = out; window.done = true;
</script>
