<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clearing PC</title>
<!-- The Clearing's PC (js/hub-pc.js) on a turntable; drag to turn it, ?a=0.4 holds it at that angle. -->
<style>html, body { margin: 0; height: 100%; background: #9ccaf0; overflow: hidden; } canvas { display: block; touch-action: none; }</style>
<script type="module">
import { loadThree } from '../js/hd2d.js';
import { pcModel, livePc } from '../js/hub-pc.js';
const T = await loadThree();
const r = new T.WebGLRenderer({ antialias: true });
r.setPixelRatio(devicePixelRatio); r.shadowMap.enabled = true; r.toneMapping = T.ACESFilmicToneMapping;
document.body.append(r.domElement);
const scene = new T.Scene(); scene.background = new T.Color('#9ccaf0'); const cam = new T.PerspectiveCamera(30, 1, 0.1, 50);
scene.add(new T.HemisphereLight('#ffffff', '#6a7a50', 1.5));
const sun = new T.DirectionalLight('#fff4e0', 2.8);
sun.position.set(-3, 7, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const floor = new T.Mesh(new T.CircleGeometry(3, 48), new T.MeshStandardMaterial({ color: '#80c858', roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const glows = [], pc = pcModel(T, glows);
for (const m of glows) m.emissiveIntensity = m.userData.glowMin * m.userData.glow;
scene.add(pc);
let a = +(new URLSearchParams(location.search).get('a') ?? -0.35), drag = null;
addEventListener('pointerdown', e => drag = e.clientX);
addEventListener('pointermove', e => { if (drag != null) { a += (e.clientX - drag) / 150; drag = e.clientX; } });
addEventListener('pointerup', () => drag = null);
function size() { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
cam.position.set(0, 2.1, 4.6); cam.lookAt(0, 0.85, 0);
r.setAnimationLoop(now => { pc.rotation.y = a; livePc(now); r.render(scene, cam); });
</script>
